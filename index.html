<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qwen OCR Website</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto;}
        #result { margin-top: 20px; padding: 15px; background: #f4f4f9; border-radius: 8px; white-space: pre-wrap;}
    </style>
</head>
<body>

    <h2>Upload Image for OCR</h2>
    <input type="file" id="imageInput" accept="image/*">
    <button onclick="runOCR()">Extract Text</button>

    <div id="result">The extracted text will appear here...</div>

    <script>
        async function runOCR() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert("Please select an image first!");
                return;
            }

            resultDiv.innerText = "Processing on local computer... please wait.";

            const formData = new FormData();
            formData.append("image", fileInput.files[0]);

            try {
                // REPLACE THIS URL with your ngrok forwarding URL + /run-ocr
                const response = await fetch("https://residence-guise-eastward.ngrok-free.dev/", {
                    method: "POST",
                    body: formData
                });

                const data = await response.json();
                resultDiv.innerText = data.extracted_text;
            } catch (error) {
                resultDiv.innerText = "Error connecting to the local server.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
