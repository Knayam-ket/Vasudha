<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qwen OCR Website</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto;}
        #result { margin-top: 20px; padding: 15px; background: #f4f4f9; border-radius: 8px; white-space: pre-wrap;}
    </style>
</head>
<body>

    <h2>Upload Image for OCR</h2>
    <input type="file" id="imageInput" accept="image/*, application/pdf"">
    <button onclick="runOCR()">Extract Text</button>

    <div id="result">The extracted text will appear here...</div>

    <script>
        async function runOCR() {
            const fileInput = document.getElementById('imageInput');
            const resultDiv = document.getElementById('result');

            if (fileInput.files.length === 0) {
                alert("Please select an image first!");
                return;
            }

            resultDiv.innerText = "Processing on local computer... please wait.";

            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            try {
                const response = await fetch("https://residence-guise-eastward.ngrok-free.dev/run-ocr", {
                    method: "POST",
                    headers: {
                        "ngrok-skip-browser-warning": "true"
                    },
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    
                    resultDiv.innerText = "Server Error: " + JSON.stringify(data);
                    return;
                }

                resultDiv.innerText = data.extracted_text;
            } catch (error) {
                resultDiv.innerText = "Error connecting to server. Check console for details.";
                console.error("Fetch Error:", error);
            }
        }
    </script>
</body>
</html>
